# Batch signer (fork 2026-10-17; sign.lua): rendered per profile by tools/prepare-material-lb.py --signed-ttl and
# included in the 443 server next to the /assets/ and /media/ locations of the same profile. Same-origin POST from
# public/sw.js only; behind the gate like the rest of the site. Signed URLs leave only in the response body.
location = /material-sign {
    access_log off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    content_by_lua_file __MATERIAL_LB_SIGN__;
}
