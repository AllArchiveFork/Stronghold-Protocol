# Signed material profile (prepare-material-lb.py --signed-ttl), http context: signed CDN URLs and per-object locks
# in shared memory only, and the keepalive pool for the public ModelScope resolve requests.
lua_shared_dict ark_ms_signed 64m;
lua_shared_dict ark_ms_lock 2m;
upstream ark_ms_api {
    server modelscope.cn:443 max_fails=0;
    keepalive 32;
    keepalive_timeout 30s;
}
