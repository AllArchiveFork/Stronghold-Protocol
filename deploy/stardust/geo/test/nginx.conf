worker_processes 4;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    # test only: lets curl pose as any client
    set_real_ip_from 0.0.0.0/0; set_real_ip_from ::/0; real_ip_header X-Real-IP;
    init_worker_by_lua_block {
        local ok, geo = pcall(dofile, "/geo/ark_geo.lua")
        if ok then package.loaded.ark_geo = geo; geo.start("/geo/cn-allow.txt", 2)
        else ngx.log(ngx.ERR, "ark_geo: ", geo) end
    }
    server {
        listen 8080;
        set_by_lua_block $ark_proto_geo_deny { local geo = package.loaded.ark_geo; return geo and geo.deny(ngx.var.binary_remote_addr) or "" }
        if ($ark_proto_geo_deny) { rewrite ^ /_ark_geo_blocked last; }
        auth_request /_check;
        add_header X-Server-Level yes always;
        location = /_check { internal; return 204; }
        location = /_ark_geo_blocked {
            internal;
            auth_request off;
            default_type "text/html; charset=utf-8";
            add_header Cache-Control "no-store" always;
            return 403 "<!doctype html><meta charset=utf-8><title>暂不可用</title><p>本服务目前仅向中国大陆网络开放。</p>\n";
        }
        location = /x404 { return 404; }
        location / { return 200 "ok\n"; }
    }
}
