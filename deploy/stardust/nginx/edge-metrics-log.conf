# Edge request counters (see edge-metrics-http.conf), server context of the site's TLS server. Route classes:
# ws, gate, assets, sign, code, simdata, monitor, feedback, health, other — a fixed set, so the labels stay bounded.
log_by_lua_block {
    local d = ngx.shared.ark_edge_metrics
    if not d then return end
    local u = ngx.var.uri or ""
    local function starts(p) return u:sub(1, #p) == p end
    local r
    if u == "/ws" or (starts("/_release/") and u:sub(-3) == "/ws") then r = "ws"
    elseif starts("/_gate/") or u == "/login" or u == "/entry" then r = "gate"
    elseif u == "/material-sign" then r = "sign"
    elseif starts("/assets/") or starts("/media/") or starts("/fonts/") or starts("/vendor/") or starts("/__ark_static__/") then r = "assets"
    elseif u == "/" or u == "/index.html" or starts("/js/") or starts("/css/") or starts("/build/") then r = "code"
    elseif starts("/sim/") or starts("/shared/") or starts("/data/") or starts("/i18n/") or starts("/server/") then r = "simdata"
    elseif u == "/monitor" or starts("/monitor/") then r = "monitor"
    elseif u == "/feedback" or starts("/feedback/") then r = "feedback"
    elseif u == "/healthz" or u == "/_server/presence" or u == "/code-source.json" or u == "/client-build" then r = "health"
    else r = "other" end
    local s = tonumber(ngx.status) or 0
    if s >= 100 and s < 600 then d:incr("r:" .. r .. ":" .. math.floor(s / 100) .. "xx", 1, 0) end
    local b = tonumber(ngx.var.bytes_sent) or 0
    if b > 0 then d:incr("b:" .. r, b, 0) end
}
