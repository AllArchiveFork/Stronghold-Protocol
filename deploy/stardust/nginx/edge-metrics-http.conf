# Edge request counters for the monitoring stack (deploy/stardust/monitoring, 2026-10-16), http context.
# edge-metrics-log.conf (server context) counts every request of the site's TLS server by route class and status class,
# plus the bytes sent; this loopback-only server hands them to Prometheus. No address, path or query string is kept.
# The counters live in a shared dict: they survive a reload (HUP) and start again from zero after a restart.
lua_shared_dict ark_edge_metrics 1m;

server {
    listen 127.0.0.1:9145;
    access_log off;
    location = /metrics {
        content_by_lua_block {
            local d = ngx.shared.ark_edge_metrics
            local keys = d:get_keys(0)
            table.sort(keys)
            local out = {
                "# HELP ark_edge_requests_total Requests of the site's TLS server by route class and status class.",
                "# TYPE ark_edge_requests_total counter",
            }
            for _, k in ipairs(keys) do
                local route, status = k:match("^r:(%l+):(%dxx)$")
                if route then
                    out[#out + 1] = string.format('ark_edge_requests_total{route="%s",status="%s"} %.0f', route, status, d:get(k) or 0)
                end
            end
            out[#out + 1] = "# HELP ark_edge_bytes_sent_total Bytes sent to clients by route class (headers included)."
            out[#out + 1] = "# TYPE ark_edge_bytes_sent_total counter"
            for _, k in ipairs(keys) do
                local route = k:match("^b:(%l+)$")
                if route then
                    out[#out + 1] = string.format('ark_edge_bytes_sent_total{route="%s"} %.0f', route, d:get(k) or 0)
                end
            end
            out[#out + 1] = "# HELP ark_edge_connections Client connections of this OpenResty (stub_status)."
            out[#out + 1] = "# TYPE ark_edge_connections gauge"
            for _, s in ipairs({ "active", "reading", "writing", "waiting" }) do
                out[#out + 1] = string.format('ark_edge_connections{state="%s"} %s', s, tonumber(ngx.var["connections_" .. s]) or 0)
            end
            ngx.header["Content-Type"] = "text/plain; version=0.0.4; charset=utf-8"
            ngx.print(table.concat(out, "\n"), "\n")
        }
    }
    location / { return 404; }
}
